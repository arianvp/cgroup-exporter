on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule: # daily at 09:42 UTC
    - cron: '42 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # The flake pins both the dependencies and the Go toolchain, so there is
    # nothing for the scheduled run to catch here.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v27
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: nix flake --print-build-logs check
  # Go fetches the toolchains the jobs below ask for, so they cover Go
  # releases that the pinned nixpkgs does not have.
  test-oldest-go:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v27
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: nix develop --command sh -c 'GOTOOLCHAIN=go$(go list -m -f "{{.GoVersion}}") go test ./...'
  test-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest]
    steps:
      - uses: cachix/install-nix-action@v27
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: nix develop --command go get go@latest
      - run: nix develop --command go get -u -t ./...
        if: matrix.dependencies == 'latest'
      - run: nix develop --command go test -race ./...
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v27
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: nix develop --command govulncheck ./...
